# Default configurations
default:
  browser: Official
  geoip: MaxMind GeoLite2

# Browser repositories
browsers:
  # Sole source: our own releases. No fallback to any daijro/camoufox-named
  # repository. Binaries must be built and published here (see `make build`)
  # before fetch/launch will work.
  - repo: ahansardar/veyra
    name: Official
    pattern: "{name}-{version}-{build}-{os}.{arch}.zip"
    versions:
      - python_library:
          min: "0.5.0"
          max: "1"
        browser:
          # Stable channel
          stable:
            min: "beta.19"
            max: "1"
          # Prerelease channel (including "alpha.*" builds) matches all versions

# GeoIP database repositories
geoip:
  # GeoLite2 City - Full city-level data with timezone
  - name: MaxMind GeoLite2
    urls:
      ipv4:
        - https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-city-mmdb/geolite2-city-ipv4.mmdb
        - https://github.com/sapics/ip-location-db/releases/download/latest/geolite2-city-ipv4.mmdb
      ipv6:
        - https://cdn.jsdelivr.net/npm/@ip-location-db/geolite2-city-mmdb/geolite2-city-ipv6.mmdb
        - https://github.com/sapics/ip-location-db/releases/download/latest/geolite2-city-ipv6.mmdb
    paths:
      iso_code: country_code
      longitude: longitude
      latitude: latitude
      timezone: timezone

